[package]
name = "emodule"
version = "0.1.0"
edition = "2024"

[dependencies]
# 关闭默认特性，仅保留实际使用的集合：
# 2d  — 精灵、Mesh2d 与 2D 渲染管线（含 Camera2d、图片、文本）
# ui  — UI 渲染栈，Feathers 组件所依赖
# bevy_feathers / webp 为独立可选特性，需显式开启。
# complex_script_segmentation — 中日文断行模型，缺失时每帧打印 ICU4X 数据错误。
bevy = { version = "0.20.1", default-features = false, features = ["2d", "ui", "bevy_feathers", "webp", "debug", "complex_script_segmentation"] }
bevy_common_assets = { version = "0.18.0", features = ["xml"] }
bincode = "2.0"
rust-ini = "0.21.3"
serde = { version = "1.0.229", features = ["derive"] }

[features]
# 仅用于开发时加速链接与诊断：`cargo run --features dev`
# `bevy/dynamic_linking`（bevy_dylib）要求 panic="unwind"，
# 与 release profile 的 panic="abort" 不兼容，因此不能在 release 中启用。
dev = ["bevy/dynamic_linking"]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
split-debuginfo = "off"
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false
